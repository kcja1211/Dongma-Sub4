<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>전성희 SUB4 캘린더</title>
<style>
:root{
 --bg:#f8f8ef; --card:#fff; --ink:#20252b; --muted:#7a7d78; --line:#e2e3dc;
 --easy:#e6f0ff; --rest:#efefec; --speed:#ffe5d5; --hill:#ebe2ff; --tempo:#ddf3e4;
 --long:#fff0ba; --strength:#f2e1ec; --race:#ffd7d7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SamsungOne","Noto Sans KR","Segoe UI",sans-serif}
.app{min-height:100vh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(248,248,239,.95);backdrop-filter:blur(10px);padding:12px 4px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;white-space:nowrap}
.tabs button.active{background:#243a34;color:#fff;border-color:#243a34}
.month{display:none;margin-top:8px}.month.active{display:block}
.month-head{display:flex;justify-content:space-between;align-items:end;padding:4px 2px 10px}
.month-head h2{margin:0;font-size:24px}.month-head span{font-size:11px;color:var(--muted)}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays div{text-align:center;font-size:12px;font-weight:700;padding:7px 0}
.weekdays div:nth-child(1){color:#e45268}.weekdays div:nth-child(7){color:#5170d6}
.day{min-height:118px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px}
.day:nth-child(7n){border-right:none}
.day.muted{background:#fafafa;color:#b9bbb6}
.num{font-size:12px;font-weight:800;margin-bottom:5px}
.day:nth-child(7n+1) .num{color:#e45268}.day:nth-child(7n+7) .num{color:#5170d6}
.item{display:flex;gap:4px;align-items:flex-start;border-radius:7px;padding:5px 4px;margin:3px 0;font-size:9.5px;line-height:1.2}
.item input{width:13px;height:13px;margin:0;flex:none;accent-color:#344f47}
.item:has(input:checked) span{text-decoration:line-through;opacity:.45}
.easy{background:var(--easy)}.rest{background:var(--rest)}.speed{background:var(--speed)}
.hill{background:var(--hill)}.tempo{background:var(--tempo)}.long{background:var(--long)}
.strength{background:var(--strength)}.race{background:var(--race);font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0 18px}
.card b{display:block;margin-bottom:5px}.card p{margin:4px 0;font-size:12px;color:#555}
.install{display:none;margin-top:8px;width:100%;padding:11px;border:0;border-radius:10px;background:#243a34;color:#fff;font-weight:800}
@media(min-width:700px){.app{max-width:680px;margin:auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>전성희 · 동아마라톤 SUB4</h1>
  <div class="sub">2027.03.21 · 일요일 시작 월간 체크 캘린더</div>
  <div class="tabs" id="tabs"></div>
  <button class="install" id="installBtn">홈 화면에 설치</button>
</header>
<div id="months"></div>
<div class="card">
  <b>조깅 가이드</b>
  <p>45~55분 · 평균 7:20~7:30/km · 최대 7:00/km</p>
  <p>주 3회 기본 / 컨디션 좋을 때 4회째 추가</p>
  <p>통증·수면 부족 시 훈련보다 회복 우선</p>
</div>
</div>

<script>
const events = {
"2026-11-04":[["보강 4회","strength"]],
"2026-11-11":[["보강 5회","strength"]],
"2026-11-18":[["언덕 25×2","hill"]],"2026-11-25":[["언덕 25×2","hill"]],
"2026-12-02":[["언덕 25×2","hill"]],"2026-12-09":[["언덕 25×2","hill"]],"2026-12-16":[["언덕 25×2","hill"]],
"2026-12-23":[["100분주","tempo"]],"2026-12-30":[["100분주","tempo"]],
"2027-01-06":[["100분주","tempo"]],"2027-01-13":[["100분주","tempo"]],"2027-01-20":[["100분주","tempo"]],"2027-01-27":[["100분주","tempo"]],
"2027-02-03":[["100분주","tempo"]],"2027-02-10":[["100분주","tempo"]],"2027-02-17":[["100분주","tempo"]],"2027-02-24":[["100분주","tempo"]],
"2026-11-28":[["20K","long"]],"2026-12-05":[["25K","long"]],"2026-12-12":[["25K","long"]],"2026-12-19":[["35K","long"]],
"2026-12-26":[["25K","long"]],"2027-01-02":[["30K","long"]],"2027-01-09":[["25K","long"]],"2027-01-16":[["35K","long"]],
"2027-01-23":[["25K","long"]],"2027-01-30":[["30K","long"]],"2027-02-06":[["25K","long"]],"2027-02-13":[["35K 리허설","long"]],
"2027-02-20":[["25K 마감","long"]],"2027-02-27":[["5K×5","long"]],"2027-03-06":[["하프","long"]],"2027-03-13":[["10K","long"]],
"2027-03-20":[["20~30분","long"]],"2027-03-21":[["동아 FULL","race"]]
};
const speedDates=["2026-11-23","2026-11-30","2026-12-07","2026-12-14","2026-12-21","2026-12-28","2027-01-04","2027-01-11","2027-01-18","2027-01-25","2027-02-01","2027-02-08","2027-02-15","2027-02-22","2027-03-01","2027-03-08"];
speedDates.forEach(d=>events[d]=(events[d]||[]).concat([["스피드","speed"]]));

function fmt(d){return d.toISOString().slice(0,10)}
function addDefault(year,month,day){
 const d=new Date(year,month-1,day), key=fmt(d);
 if(events[key]) return;
 const wd=d.getDay(); // Sun=0
 if(wd===2||wd===4) events[key]=[["이지 45~55","easy"]];
 else if(wd===0) events[key]=[["회복/휴식","easy"]];
 else if(wd===5) events[key]=[["휴식","rest"]];
 else if(wd===6) events[key]=[["이지/휴식","rest"]];
 else if(wd===1 && key<"2026-11-23") events[key]=[["이지 45~55","easy"]];
 else if(wd===3) events[key]=[["이지 45~55","easy"]];
}
const months=[[2026,11],[2026,12],[2027,1],[2027,2],[2027,3]];
months.forEach(([y,m])=>{
 const last=new Date(y,m,0).getDate();
 for(let d=1;d<=last;d++) addDefault(y,m,d);
});
["2026-12-20","2027-01-17","2027-02-14","2027-02-28","2027-03-07","2027-03-14"].forEach(d=>events[d]=[["회복/완전휴식","rest"]]);

const tabs=document.getElementById('tabs'), wrap=document.getElementById('months');
const monthNames={11:"11월",12:"12월",1:"1월",2:"2월",3:"3월"};
months.forEach(([y,m],idx)=>{
 const b=document.createElement('button'); b.textContent=monthNames[m]; if(idx===0)b.classList.add('active'); tabs.appendChild(b);
 const sec=document.createElement('section'); sec.className='month'+(idx===0?' active':'');
 sec.innerHTML=`<div class="month-head"><h2>${y}년 ${monthNames[m]}</h2><span>${idx===4?'TAPER / RACE':'BUILD'}</span></div>
 <div class="weekdays">${["일","월","화","수","목","금","토"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid"></div>`;
 wrap.appendChild(sec);
 b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.month').forEach(x=>x.classList.remove('active'));sec.classList.add('active')};
 const grid=sec.querySelector('.grid');
 let first=new Date(y,m-1,1), start=first.getDay();
 let cur=new Date(y,m-1,1-start);
 for(let i=0;i<42;i++){
  const inMonth=cur.getMonth()===m-1, key=fmt(cur);
  const cell=document.createElement('div'); cell.className='day'+(inMonth?'':' muted');
  cell.innerHTML=`<div class="num">${cur.getDate()}</div>`;
  if(inMonth && events[key]) events[key].forEach(([txt,kind],j)=>{
    const id='c-'+key+'-'+j;
    const lab=document.createElement('label'); lab.className='item '+kind;
    lab.innerHTML=`<input type="checkbox" data-key="${id}"><span>${txt}</span>`;
    cell.appendChild(lab);
  });
  grid.appendChild(cell); cur.setDate(cur.getDate()+1);
 }
});
document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
 const k=cb.dataset.key; cb.checked=localStorage.getItem(k)==='1';
 cb.onchange=()=>localStorage.setItem(k,cb.checked?'1':'0');
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault(); deferredPrompt=e; installBtn.style.display='block';
});
installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'};
</script>
</body>
</html>
